name: Validate model and tool

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: python -m stories_promo recommend --request examples/request.json
      - run: python -m stories_promo reproduce --artifact artifacts/local/model.json --reports reports/local
